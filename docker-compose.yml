services:
  # FRONTEND (Vue + Vuetify)
  frontend:
    build: ./frontend
    container_name: ipdv_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # BACKEND (Node + Express)
  backend:
    build: ./backend
    container_name: ipdv_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ipdv_db
      DATABASE_URL: postgres://postgres:postgres@db:5432/ipdv_db
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
      
  # DATABASE (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: ipdv_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ipdv_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: